<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Conway's Game of Life</title>
    <style>
      body {
        margin: 0;
        padding: 0;
      }

      canvas {
        border: solid;
        display: block;
        margin-left: auto;
        margin-right: auto;
        background-color: bisque;
        width: 800px;
        height: 600px;
      }

      .btn-group {
        text-align: center;
      }

      .zoom-btn {
        width: 50px;
        height: 40px;
        border: solid black;
        background-color: rgb(170, 170, 170);
        border-radius: 10px;
        cursor: pointer;
        font-size: 20px;
        margin: 10px;
      }

      .zoom-btn:hover {
        filter: brightness(1.2);
        transition: 0.5s;
      }

      .slider-container {
        margin-top: 40px;
        text-align: center;
      }

      #grid-slider {
        width: 200px;
      }
    </style>
  </head>
  <body>
    <h1>hello</h1>
    <canvas id="gameCanvas"></canvas>
    <div class="slider-container">
      <label for="grid-slider">Grid Size:</label>
      <input
        oninput="redrawGrid()"
        id="grid-slider"
        type="range"
        min="5"
        max="100"
        value="50"
      />
    </div>
    <script src="script.js"></script>
  </body>
</html>
